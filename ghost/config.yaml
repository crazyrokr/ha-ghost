name: Ghost
version: "0.0.1"
slug: ghost
description: Runs Ghost within your Home Assistant setup providing integration of live-features
url: https://github.com/crazyrokr/ha-ghost/tree/main/ghost
webui: http://[HOST]:[PORT:3000]
panel_icon: "mdi:ghost-outline"
arch:
  - aarch64
  - amd64
init: false
tmpfs: true
map:
  - type: addon_config
    read_only: False
    path: /config
  - type: share
    read_only: False
    path: /share
ingress: true
ingress_port: 3000
ports:
  3000/tcp: null
  3001/tcp: null
  8082/tcp: null
