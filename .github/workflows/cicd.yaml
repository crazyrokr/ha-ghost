---
name: CI/CD

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Working branch"
        type: string
        required: false
        default: ""
      force_build:
        description: "Force build"
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  auto-lock:
    runs-on: ubuntu-latest
    name: Pin Docker Images
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: crazyrokr/gha-workflows/ha-addon-auto-locker@c03d56f69b5ae10ccfee1afaa56bce98e3a696ae # master
        with:
          branch: ${{ github.event.inputs.branch }}
          lookup_sources: Dockerfile
  run-builder:
    needs: auto-lock
    uses: crazyrokr/gha-workflows/.github/workflows/ha-addon-cicd.yaml@c03d56f69b5ae10ccfee1afaa56bce98e3a696ae # master
    with:
      force_build: ${{ inputs.force_build || false }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      packages: write
